name: redesoft
version: "1.0.0"
profile: redesoft

model-paths: ["models"]
macro-paths: ["macros"]

vars:
  # Diferença aceitável entre a saída no encerrante (menos aferição) e os litros vendidos (% do vendido).
  tolerancia_pct: 0.6

models:
  redesoft:
    staging:
      +schema: staging
      +materialized: view
      b2click:
        +tags: [b2click]
      cadastros_api:
        +tags: [cadastros_api]
    gold:
      +schema: gold
      +materialized: table
      +tags: [b2click]

data_tests:
  redesoft:
    +tags: [b2click]
