version: 2
models:
  - name: dim_empresa
    columns:
      - name: cod_empresa
        data_tests: [unique, not_null]
  - name: dim_tanque
    columns:
      - name: chave_tanque
        data_tests: [unique, not_null]
  - name: fct_vendas_diario
    columns:
      - name: chave
        data_tests: [unique, not_null]
  - name: fct_vendas_tanque_diario
    columns:
      - name: chave
        data_tests: [unique, not_null]
  - name: fct_pagamentos_diario
    columns:
      - name: chave
        data_tests: [unique, not_null]
  - name: fct_afericao_bico_turno
    description: Encerrante x aferição x vendido, por bico e turno.
    columns:
      - name: chave
        data_tests: [unique, not_null]
  - name: fct_conciliacao_tanque_diario
    description: Saída nos encerrantes (menos aferição) x litros vendidos, por tanque e dia.
    columns:
      - name: chave
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: [ok, fora_tolerancia, sem_venda, sem_movimento]
